<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Codex Web Chat — A little space for big ideas.</title>
  <desc id="desc">A green banner with a conversation motif for a personal Codex workspace.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#102e29"/>
      <stop offset="1" stop-color="#173e32"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#82c9a2" stop-opacity=".2"/>
      <stop offset="1" stop-color="#82c9a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x2="1" y2="0">
      <stop stop-color="#e4f4d6"/>
      <stop offset="1" stop-color="#9cd8b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <ellipse cx="890" cy="185" rx="310" ry="175" fill="url(#glow)"/>
  <g fill="none" stroke="#b4dabc" stroke-opacity=".09">
    <circle cx="965" cy="180" r="115"/>
    <circle cx="965" cy="180" r="155"/>
    <circle cx="965" cy="180" r="195"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
