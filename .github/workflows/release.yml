name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag and package version must match.' }
      - name: Test before publishing
        run: npm test
      - name: Build packages from tracked application files
        run: npm run release:build
      - name: Archive and checksum
        shell: pwsh
        run: |
          $zip = "dist/codex-web-chat-$env:RELEASE_TAG.zip"
          Compress-Archive -LiteralPath dist/codex-web-chat -DestinationPath $zip
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          Add-Content -LiteralPath dist/SHA256SUMS.txt -Value "$digest  codex-web-chat-$env:RELEASE_TAG.zip" -Encoding utf8
      - name: Publish only after every asset is uploaded
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Codex Web Chat $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          $assets = @(Get-ChildItem dist -File | Select-Object -ExpandProperty FullName)
          gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
